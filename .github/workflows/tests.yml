name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    env:
      AUTOMATION_EXERCISE_EMAIL: ${{ secrets.AUTOMATION_EXERCISE_EMAIL }}
      AUTOMATION_EXERCISE_PASSWORD: ${{ secrets.AUTOMATION_EXERCISE_PASSWORD }}
      AUTOMATION_EXERCISE_USERNAME: ${{ secrets.AUTOMATION_EXERCISE_USERNAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --no-install-project

      - name: Install Playwright browser
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Run automated tests
        working-directory: docs/automation
        run: uv run --no-sync pytest tests -q --output test-results

      - name: Upload automated test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: docs/automation/test-results/
          if-no-files-found: warn
